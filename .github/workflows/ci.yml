name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasalslot
          POSTGRES_PASSWORD: fasalslot
          POSTGRES_DB: fasalslot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fasalslot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fasalslot:fasalslot@localhost:5432/fasalslot
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/types

      - run: npm run migrate -w apps/api

      - run: npm run typecheck -w apps/api

      - run: npm run lint -w apps/web

      - run: npm run build -w apps/api

      - run: npm run build -w apps/web
